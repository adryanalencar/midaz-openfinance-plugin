services:
  plugin-openfinance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: midaz-plugin-openfinance
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - ENV_NAME=development
      - LOG_LEVEL=info
      - SERVER_ADDRESS=0.0.0.0:8085
      - PLUGIN_HOST=http://plugin-openfinance:8085
      - PROVIDER=openfinance
      - SYNC_INTERVAL_MINUTES=60
      - LOOKBACK_WINDOW_HOURS=24
      - DB_HOST=plugin-postgres
      - DB_PORT=5432
      - DB_USER=midaz
      - DB_PASSWORD=midaz_secure_password
      - DB_NAME=plugin_openfinance
      - DB_SSLMODE=disable
      - MIDAZ_ONBOARDING_URL=http://midaz-onboarding:3000
      - MIDAZ_TRANSACTION_URL=http://midaz-transaction:3001
      - MIDAZ_ORGANIZATION_ID=00000000-0000-0000-0000-000000000000
      - MIDAZ_LEDGER_ID=00000000-0000-0000-0000-000000000000
      - MIDAZ_CLEARING_ACCOUNT_ALIAS=@external/BRL:openfinance
      - OPENFINANCE_ENVIRONMENT=sandbox
      - OPENFINANCE_DIRECTORY_URL=https://matls-auth.sandbox.directory.openbankingbrasil.org.br
    depends_on:
      plugin-postgres:
        condition: service_healthy
    networks:
      - midaz-network

  plugin-postgres:
    image: postgres:16-alpine
    container_name: midaz-plugin-postgres
    restart: unless-stopped
    ports:
      - "5433:5432" # exposed on host 5433 to avoid collision with Midaz core postgres 5432
    environment:
      - POSTGRES_USER=midaz
      - POSTGRES_PASSWORD=midaz_secure_password
      - POSTGRES_DB=plugin_openfinance
    volumes:
      - plugin-pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midaz -d plugin_openfinance"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - midaz-network

volumes:
  plugin-pgdata:
    driver: local

networks:
  midaz-network:
    name: midaz-network
    external: false
